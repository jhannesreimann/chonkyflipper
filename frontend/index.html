<!doctype html>
<html lang="en" data-theme="chonky-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16140f" />
  <link rel="icon" type="image/png" href="/assets/logo1.png" />
  <title>ChonkyFlipper</title>
  <script>
    // Set the saved theme before paint to avoid a flash of the wrong colors.
    try {
      var t = localStorage.getItem('chonky-theme') || 'chonky-dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
