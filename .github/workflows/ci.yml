name: CI

# ChonkyFlipper runs on a Raspberry Pi 4 (Kali ARM64); this pipeline only
# verifies what can be checked on standard runners:
#   - the dashboard builds
#   - backend Python sources are syntactically valid
# Hardware-dependent modules (spidev, lgpio, libnfc) cannot be installed or
# exercised here, and no deploy steps require secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-syntax:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall backend
