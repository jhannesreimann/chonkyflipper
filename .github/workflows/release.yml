name: Release

# Manual releases: Actions tab -> Run workflow -> pick major/minor/patch.
# Bumps the frontend version, pushes a release commit to the current branch,
# then tags it and creates a GitHub Release with auto-generated notes.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags so auto-generated release notes work correctly
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Updates package.json and package-lock.json atomically, prints e.g. v2.1.1
      - name: Bump version
        working-directory: frontend
        run: |
          NEW_VERSION=$(npm version "${{ github.event.inputs.bump }}" --no-git-tag-version)
          echo "NEW_VERSION=${NEW_VERSION#v}" >> "$GITHUB_ENV"

      # Commit and push BEFORE tagging so the tag includes the version bump
      - name: Commit and push version bump
        run: |
          git add frontend/package.json frontend/package-lock.json
          git commit -m "release v${{ env.NEW_VERSION }}"
          git push origin HEAD

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          generate_release_notes: true
